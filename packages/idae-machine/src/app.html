<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the persisted theme before first paint so there is no light/dark
			// flash on load. 'auto' (or unset) leaves data-theme off → css-base follows
			// prefers-color-scheme. Mirrors the values written by the taskbar toggle.
			(function () {
				try {
					var t = localStorage.getItem('idae_theme');
					if (t === 'light' || t === 'dark') {
						document.documentElement.setAttribute('data-theme', t);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div>%sveltekit.body%</div>
	</body>
</html>
